server:
  port: 8081
spring:
  application:
    name: wisetour
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/wisetour?useSSL=false&serverTimezone=UTC
    username: root
    password: iicebear1104
  redis:
    host: 172.27.170.110
    port: 6379
    password: 71704
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: wisetour-seckill-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.wisetour.entity,com.wisetour.dto"
  elasticsearch:
    rest:
      uris: http://localhost:9200
      username: elastic
      password: wisetour@2024
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.wisetour.entity # 别名扫描包
logging:
  level:
    com.wisetour: debug